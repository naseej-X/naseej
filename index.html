<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --font-ui:"Readex Pro","Segoe UI",Tahoma,"Geeza Pro","Noto Sans Arabic","DejaVu Sans",Arial,sans-serif;
  --font-kufi:"Reem Kufi","Readex Pro","Segoe UI",Tahoma,"Geeza Pro","Noto Kufi Arabic",sans-serif;
  --bg:#F5F3F0;--surface:#FFFFFF;--surface-2:#ECE7E1;--ink:#2A211F;--muted:#6F625A;
  --line:#E0D8CF;--warp-bg:#EAE4DD;--warp:#CABFB3;--accent:#A8292B;--on-accent:#FFFFFF;
  --gold:#C08710;--gold-ink:#8A5D06;--motif:#FFFBF5;--edge:#2A211F;
  --shadow:0 14px 36px rgba(42,33,31,.18);
  --th-madder:#A8292B;--th-saffron:#C98A12;--th-indigo:#2F4B80;--th-olive:#5C7330;
  --th-teal:#1D7268;--th-plum:#7A3A6A;--th-ochre:#C1571F;--th-kohl:#3A2E2A;
  --th:var(--accent);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#191413;--surface:#231C1A;--surface-2:#2F2623;--ink:#F2ECE5;--muted:#ADA197;
    --line:#3A302C;--warp-bg:#221B19;--warp:#54473F;--accent:#E2564F;--on-accent:#191413;
    --gold:#E8AF3C;--gold-ink:#E8AF3C;--motif:#191413;--edge:#F2ECE5;
    --shadow:0 14px 36px rgba(0,0,0,.55);
    --th-madder:#E2564F;--th-saffron:#E8AF3C;--th-indigo:#86A3DC;--th-olive:#A2BE6E;
    --th-teal:#55C3B6;--th-plum:#CB86B9;--th-ochre:#EF8D55;--th-kohl:#E6DDD3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#191413;--surface:#231C1A;--surface-2:#2F2623;--ink:#F2ECE5;--muted:#ADA197;
  --line:#3A302C;--warp-bg:#221B19;--warp:#54473F;--accent:#E2564F;--on-accent:#191413;
  --gold:#E8AF3C;--gold-ink:#E8AF3C;--motif:#191413;--edge:#F2ECE5;
  --shadow:0 14px 36px rgba(0,0,0,.55);
  --th-madder:#E2564F;--th-saffron:#E8AF3C;--th-indigo:#86A3DC;--th-olive:#A2BE6E;
  --th-teal:#55C3B6;--th-plum:#CB86B9;--th-ochre:#EF8D55;--th-kohl:#E6DDD3;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;touch-action:manipulation}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
svg{display:block}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.c-madder{--th:var(--th-madder)}.c-saffron{--th:var(--th-saffron)}.c-indigo{--th:var(--th-indigo)}.c-olive{--th:var(--th-olive)}
.c-teal{--th:var(--th-teal)}.c-plum{--th:var(--th-plum)}.c-ochre{--th:var(--th-ochre)}.c-kohl{--th:var(--th-kohl)}
.th-fill{fill:var(--th)}
.wv-edge{fill:var(--edge)}.wv-motif{fill:var(--motif)}
.wp-bg{fill:var(--warp-bg)}.wp-edge{fill:var(--line)}.wp-line{stroke:var(--warp);stroke-width:1.4}
#defs-host{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flame{width:13px;height:13px;fill:currentColor;flex:none}
.logo-a{fill:var(--accent)}.logo-m{fill:var(--motif)}.logo-e{fill:var(--edge)}

/* ---------- shell ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto;padding:14px 18px 2px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-kufi);font-weight:700;font-size:1.35rem;line-height:1}
.brand svg{width:26px;height:26px}
.status{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.status i{width:7px;height:7px;background:var(--warp);transform:rotate(45deg);flex:none}
.status.is-cloud i{background:var(--th-olive)}.status.is-saving i{background:var(--gold)}.status.is-local i{background:var(--th-indigo)}
.status.is-error{color:var(--accent);border-color:currentColor}.status.is-error i{background:var(--accent)}
.status button{text-decoration:underline;text-underline-offset:3px}
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:4px;border-radius:12px;font-size:.76rem;color:var(--muted);text-align:center}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:500}
.tab[aria-current="page"] svg{stroke-width:2.1}
.view{max-width:720px;margin:0 auto;padding:4px 18px calc(112px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){
  .tabs{position:static;width:min(684px,calc(100% - 36px));margin:12px auto 0;padding:5px;border:1px solid var(--line);border-radius:14px}
  .tab{flex-direction:row;gap:8px;min-height:42px;font-size:.92rem}
  .tab[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
  .view{padding-bottom:64px}
}

/* ---------- today ---------- */
.hello{display:flex;align-items:center;gap:14px;margin-top:16px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--surface-2);overflow:hidden;flex:none;line-height:1;user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-m{width:60px;height:60px;font-size:32px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.av-l{width:88px;height:88px;font-size:46px;box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--accent)}
.greet{color:var(--muted);font-size:.95rem;line-height:1.3}
.name{font-family:var(--font-kufi);font-weight:700;font-size:clamp(1.9rem,6.4vw,2.6rem);line-height:1.15;overflow-wrap:anywhere}
.dates{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin-top:14px;font-size:.95rem}
.dates .hijri{color:var(--muted);font-size:.88rem}
.back-today{margin-inline-start:auto;font-size:.85rem;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.goal{margin-top:4px;color:var(--muted);font-size:.9rem}
.band-wrap{margin-top:16px}
.band{display:block;width:100%;border-radius:8px;overflow:hidden}
.band.is-full{outline:2px solid var(--gold);outline-offset:3px}
.band-sep{stroke:var(--bg);stroke-width:3}
.band-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px}
.band-cap strong{font-family:var(--font-kufi);font-weight:600;font-size:1.2rem;line-height:1.3}
.band-cap span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.week{display:flex;align-items:center;gap:4px;margin-top:20px}
.wk-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;list-style:none;margin:0;padding:0}
.wk-nav{flex:none;width:30px;height:46px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.wd{width:100%;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 8px;border-radius:12px;text-align:center}
.wd-i{font-size:.74rem;color:var(--muted);line-height:1.4}
.wd-n{font-weight:600;font-variant-numeric:tabular-nums;line-height:1.4}
.wd svg{width:14px;height:14px;margin-top:3px}
.wd.is-sel{background:var(--ink);color:var(--bg)}
.wd.is-sel .wd-i{color:inherit;opacity:.75}
.wd.is-today:not(.is-sel) .wd-n{color:var(--accent)}
.md-fill{fill:var(--accent)}.md-eye{fill:var(--motif)}.md-miss{fill:none;stroke:var(--warp);stroke-width:1.3}.md-off{fill:var(--warp)}
.wd.is-sel .md-fill{fill:var(--gold)}.wd.is-sel .md-eye{fill:var(--ink)}.wd.is-sel .md-miss{stroke:var(--muted)}
.groups{margin-top:10px}
.ghead{font-size:.82rem;font-weight:500;color:var(--muted);margin:18px 0 0}
.hlist{list-style:none;margin:0;padding:0}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tog{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:12px}
.tog svg{width:46px;height:46px;transition:transform .15s ease}
.tog:active svg{transform:scale(.9)}
.t-out{fill:none;stroke:var(--th);stroke-width:2}
.t-fill{fill:var(--th)}
.t-chk{fill:none;stroke:var(--motif);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.t-num{fill:var(--ink);font:600 13px var(--font-ui);direction:ltr}
.t-num.on{fill:var(--motif)}
.h-main{flex:1;min-width:0}
.h-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.h-ico{font-size:1.15rem;line-height:1;flex:none}
.h-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow.is-done .h-txt{color:var(--muted)}
.h-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-top:1px;font-size:.8rem;color:var(--muted)}
.h-meta:empty{display:none}
.cnt{font-variant-numeric:tabular-nums}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--gold-ink)}
.minus{padding:0 9px;min-height:24px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;color:var(--muted);direction:ltr}
.strand{flex:none}
.st-miss{fill:none;stroke:var(--warp);stroke-width:1.4}
.st-pend{fill:none;stroke:var(--th);stroke-width:1.4;stroke-dasharray:2.2 1.8}
.st-off{fill:var(--warp)}
@media (max-width:350px){.strand{display:none}}
.empty{margin-top:18px;padding:24px 18px;border:1.5px dashed var(--warp);border-radius:16px;text-align:center}
.empty p{color:var(--muted);margin-bottom:12px}
.empty p:last-child{margin-bottom:0}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 18px;border-radius:12px;font-weight:500;font-size:.95rem;line-height:1.3}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-danger{color:var(--accent);border:1px solid currentColor}
.btn-sm{min-height:34px;padding:4px 12px;font-size:.85rem;border-radius:10px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
@media (hover:hover){.ibtn:not(:disabled):hover{background:var(--surface-2);color:var(--ink)}.btn-ghost:hover{background:var(--surface-2)}}
.field{display:block;margin-top:16px}
.lbl{display:block;margin-bottom:7px;font-size:.85rem;font-weight:500;color:var(--muted)}
.inp{display:block;width:100%;min-height:46px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem}
.inp:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.inp::placeholder{color:var(--muted);opacity:.75}
.err{min-height:1.2em;margin-top:6px;font-size:.85rem;color:var(--accent)}
.err:empty{min-height:0;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chips button{min-height:38px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:.9rem;line-height:1.3}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg--days button{min-width:52px;padding-inline:10px}
.presets{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:10px}
.presets button{font-size:.82rem;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emo{height:44px;display:grid;place-items:center;border-radius:12px;background:var(--bg);border:1.5px solid transparent;font-size:1.35rem;line-height:1}
.emo[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.swatches{display:flex;flex-wrap:wrap;gap:14px;padding:6px 6px 2px}
.sw{position:relative;width:30px;height:30px;border-radius:4px;background:var(--th);transform:rotate(45deg)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--th)}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:10px;border-radius:2px;background:var(--motif)}
.switch{display:flex;align-items:center;gap:10px;margin-top:16px;cursor:pointer;width:fit-content}
.switch input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.sugg button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 12px;border:1px dashed var(--warp);border-radius:999px;font-size:.85rem;background:var(--bg)}
.note{font-size:.86rem;line-height:1.75;color:var(--muted)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- habits ---------- */
.pane{margin-top:20px}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.h2{font-family:var(--font-kufi);font-weight:700;font-size:1.6rem;line-height:1.3}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 0;padding-inline-start:12px;border-bottom:1px solid var(--line);border-inline-start:4px solid var(--th)}
.m-ico{font-size:1.4rem;line-height:1;flex:none}
.m-main{flex:1;min-width:0}
.m-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-meta{font-size:.8rem;color:var(--muted)}
.m-act{display:flex;align-items:center;gap:2px;flex:none}
.arch{margin-top:24px}
.arch summary{cursor:pointer;padding:8px 0;font-size:.92rem;color:var(--muted)}
.arch .mrow{border-inline-start-color:var(--warp)}

/* ---------- dialogs ---------- */
dialog{padding:0;border:0;background:transparent;color:inherit;max-width:100vw;max-height:100vh;max-height:100dvh;overflow:visible}
dialog::backdrop{background:rgba(25,18,16,.5)}
.sheet{display:flex;flex-direction:column;width:min(560px,calc(100vw - 32px));max-height:88vh;max-height:min(88dvh,880px);background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 6px}
.sheet-head h2{font-family:var(--font-kufi);font-weight:700;font-size:1.35rem}
.sheet-body{overflow-y:auto;padding:0 18px 14px;overscroll-behavior:contain}
.sheet-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.sheet-foot .btn-ghost:first-child{margin-inline-end:auto}
.sheet-foot{flex-wrap:wrap}
.sheet-foot .btn-primary{margin-inline-start:auto}
.cf-msg{padding:22px 20px 8px;line-height:1.8}
@media (max-width:640px){
  dialog.dlg{margin:auto 0 0;width:100%}
  dialog.dlg .sheet{width:100%;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}

/* ---------- stats ---------- */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:34px 0 4px}
.mnav .h2{font-size:1.25rem;text-align:center}
.rug{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.rug-h{padding-bottom:2px;font-size:.72rem;text-align:center;color:var(--muted)}
.rc{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:9px;background:var(--bg)}
.rc svg{position:absolute;inset:14%;width:72%;height:72%}
.rc-n{position:absolute;top:4px;inset-inline-start:6px;font-size:.66rem;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.rc.is-today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.rc.is-future{opacity:.45}
.rc-blank{background:transparent}
.rc-eye{fill:var(--motif)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:16px;height:16px}
.sums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.sum{padding-top:10px;border-top:2px solid var(--th)}
.sum b{display:block;font-family:var(--font-kufi);font-weight:600;font-size:1.3rem;line-height:1.3;font-variant-numeric:tabular-nums}
.sum span{display:block;margin-top:2px;font-size:.78rem;color:var(--muted);line-height:1.5}
.sum .sum-sub{margin-top:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h3{font-family:var(--font-kufi);font-weight:600;font-size:1.15rem;margin:28px 0 6px}
.htable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.9rem}
.htable th{padding:6px 0;font-size:.74rem;font-weight:500;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.htable th:first-child{text-align:start}
.htable td{padding:10px 0;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;vertical-align:middle}
.htable td:first-child{text-align:start}
.htable col.c-num{width:62px}.htable col.c-pc{width:86px}
.ht-name{display:flex;align-items:center;gap:8px;min-width:0}
.ht-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:block;height:5px;margin:5px auto 0;width:56px;border-radius:3px;background:var(--warp-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--th)}

/* ---------- profile & onboarding ---------- */
.pf-id{display:flex;align-items:center;gap:18px;margin-top:18px}
.pf-name{font-family:var(--font-kufi);font-weight:700;font-size:1.5rem;line-height:1.25;overflow-wrap:anywhere}
.section{margin-top:30px}
.section > h3{font-family:var(--font-kufi);font-weight:600;font-size:1.15rem;margin-bottom:10px}
.avp-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.types{grid-template-columns:repeat(3,minmax(0,1fr))}}
.type{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:start}
.type .t-ico{font-size:1.6rem;line-height:1.2}
.type .t-name{font-family:var(--font-kufi);font-weight:600;font-size:1.05rem}
.type .t-desc{font-size:.78rem;line-height:1.55;color:var(--muted)}
.type[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.type[aria-pressed="true"]::after{content:"";position:absolute;top:14px;inset-inline-end:14px;width:10px;height:10px;background:var(--accent);transform:rotate(45deg)}
.picks{list-style:none;margin:10px 0 0;padding:0}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:start}
.pick .box{display:grid;place-items:center;width:22px;height:22px;flex:none;border:1.5px solid var(--warp);border-radius:6px}
.pick .box .ic{width:15px;height:15px;stroke:var(--bg);stroke-width:3;opacity:0}
.pick[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.pick[aria-pressed="true"] .box .ic{opacity:1}
.p-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.p-meta{font-size:.78rem;color:var(--muted)}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:26px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.savebar p{font-size:.86rem;color:var(--muted);padding-inline-start:4px}
.savebar.is-dirty{position:sticky;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:var(--shadow)}
.savebar.is-dirty p{color:var(--ink)}
@media (min-width:760px){.savebar.is-dirty{bottom:16px}}
.danger{margin-top:34px;padding-top:18px;border-top:1px dashed var(--warp)}
.ob{max-width:580px;margin:0 auto;padding:18px 18px calc(48px + env(safe-area-inset-bottom,0px))}
.ob-brand{display:flex;align-items:center;gap:9px;font-family:var(--font-kufi);font-weight:700;font-size:1.4rem;line-height:1}
.ob-brand svg{width:28px;height:28px}
.ob .band{margin-top:18px}
.ob-step{margin-top:24px;font-size:.85rem;color:var(--muted)}
.ob-title{margin-top:2px;font-family:var(--font-kufi);font-weight:700;font-size:clamp(2rem,7.5vw,2.7rem);line-height:1.2}
.ob-lead{max-width:46ch;margin-top:8px;color:var(--muted)}
.ob-av{margin-top:22px}
.ob-actions{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.ob-actions .btn-primary{min-width:150px;margin-inline-start:auto}
.ob-note{margin-top:14px}

.top-start{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.status{flex:none}

.pchip{display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:min(240px,100%);min-height:40px;padding-block:4px;padding-inline:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.pchip .ic{width:16px;height:16px;color:var(--muted)}
.pchip-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:.9rem}
.av-s{width:30px;height:30px;font-size:17px}
.av-p{width:46px;height:46px;font-size:25px}
.hello-av{border-radius:50%;flex:none}
.plist{list-style:none;margin:0;padding:0}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;border-bottom:1px solid var(--line);text-align:start}
.prow-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.prow-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow-meta{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-head{margin-top:16px;font-size:.84rem;font-weight:600}
.sugg-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-top:18px}
.prow[aria-current="true"] .prow-name{color:var(--accent)}
.prow-mark{width:10px;height:10px;background:var(--accent);transform:rotate(45deg);flex:none;margin-inline-end:6px}
.pf-switch{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-top:16px;padding:10px 12px;border:1px dashed var(--warp);border-radius:14px}
.pf-switch p{font-size:.86rem;color:var(--muted)}

/* ---------- charts ---------- */
.perf-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-top:24px}
.perf-head .h3{margin:0}
.seg--sm button{min-height:34px;padding:4px 13px;font-size:.84rem}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;margin-top:18px}
.ch-y{position:relative;width:2.5rem;height:var(--h);font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ch-y span{position:absolute;inset-inline-end:0;transform:translateY(-50%);line-height:1}
.ch-plot{position:relative;height:var(--h)}
.ch-grid i{position:absolute;inset-inline:0;height:0;border-top:1px dashed var(--line)}
.ch-grid i:nth-child(1){top:0}.ch-grid i:nth-child(2){top:50%}.ch-grid i:nth-child(3){top:100%;border-top:1.5px solid var(--warp)}
.ch-bars{position:absolute;inset:0;display:flex;align-items:stretch}
.cbar{position:relative;flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:6px 6px 0 0}
.cbar i{position:relative;display:block;width:min(64%,26px);height:calc(var(--v) * 100%);border-radius:3px 3px 0 0;background:var(--th);transform-origin:bottom;animation:grow .45s cubic-bezier(.2,.7,.2,1) both}
.cbar.is-zero i{height:3px;background:var(--warp)}
.cbar.is-none i{width:4px;height:4px;margin-bottom:-2px;border-radius:50%;background:var(--warp);animation:none}
.cbar.is-cur i{background:repeating-linear-gradient(135deg,var(--th) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1.5px var(--th)}
.cbar.is-full i::before,.cbar.is-best i::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4.5px;background:var(--gold);transform:rotate(45deg)}
.chart.dense .cbar i::before{top:-4px;width:6px;height:6px;margin-left:-3px}
.cbar.is-sel{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.cbar:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.ch-line{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ch-line polyline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.7}
.ch-x{display:flex;margin-top:6px;font-size:.66rem;line-height:1.35;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ch-x span{flex:1 1 0;min-width:0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;overflow:visible}
.ch-x em{font-style:normal;display:block}
.ch-info{min-height:1.6em;margin-top:10px;font-size:.9rem;font-weight:500}
.ch-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;font-size:.76rem;color:var(--muted)}
.ch-legend span{display:inline-flex;align-items:center;gap:6px}
.ch-legend i{display:inline-block;width:12px;height:10px;border-radius:2px;background:var(--th)}
.ch-legend i.ln{height:2px;background:var(--ink);opacity:.7}
.ch-legend i.st{background:repeating-linear-gradient(135deg,var(--th) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--th)}
.sums--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.sum b.up{color:var(--th-olive)}.sum b.down{color:var(--accent)}
.wd-sec{margin-top:6px}
@keyframes grow{from{transform:scaleY(0)}}

.pw{position:relative;display:block}

.linkbtn{color:var(--accent);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}

.au-switch{margin-top:18px;font-size:.92rem;text-align:center}
.au-info{margin-top:8px;font-size:.86rem;color:var(--th-olive)}

.danger{display:flex;flex-wrap:wrap;gap:10px}

textarea.inp{min-height:88px;resize:vertical;line-height:1.7}

.trow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}

.tchk .ic{width:18px;height:18px;stroke-width:3}
.trow.is-done .tchk{background:var(--th-kohl);color:var(--motif)}
.ttxt{flex:1;min-width:0;line-height:1.6;overflow-wrap:anywhere}
.trow.is-done .ttxt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--warp)}
.tdel{width:36px;height:36px}
.tdel .ic{width:16px;height:16px}
.task-add{display:flex;gap:8px;margin-top:10px}
.task-add .inp{flex:1;min-width:0}
.task-add .btn{flex:none}

/* ---------- misc ---------- */
.loading{min-height:78vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.loading svg{width:46px;height:46px;margin:0 auto 14px;animation:turn 1.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes turn{to{transform:rotate(90deg)}}
.toast{position:fixed;inset-inline:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;width:max-content;max-width:calc(100% - 32px);margin:0 auto;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:.9rem;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (min-width:760px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

    const f0 = prevMap ? (prevMap[r.dataset.id] || 0) : 0;
    if (f0 >= f) return;

  const lead = (dowOf(first) - ws + 7) % 7;
  let cells = orderDays(ws).map(d => `<div class="rug-h" aria-hidden="true">${DAY_INIT[d]}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<div class="rc rc-blank" aria-hidden="true"></div>';
  let perfect = 0, schedDays = 0, tn = 0, td = 0, tdays = 0;
  for (let d = 1; d <= nDays; d++) {
    const k = mk + '-' + pad(d);
    cells += rugCell(k, L, t, T);
    if (k <= t) {
      const ds = dayStats(k, L, T);
      if (ds.n) { schedDays++; if (ds.done === ds.n) perfect++; }
      if (ds.tn) { tdays++; tn += ds.tn; td += ds.td; }
    }
  }
  const to = last < t ? last : t;
  const rate = first <= to ? rangeRate(L, first, to, T) : null;
  const pc = rate == null ? '—' : Math.round(rate * 100) + '٪';
  let sums;
  if (selH) {
    sums = [[pc, 'نسبة الإنجاز في هذا الشهر'], [`${perfect} من ${schedDays}`, 'أيام الإنجاز'], [daysAr(streakOf(selH)), 'السلسلة الحالية']];
  } else if (isTasks) {
    sums = [[pc, 'نسبة إنجاز المهام في هذا الشهر'], [`${td} من ${tn}`, 'مهام منجزة'], [String(tdays), 'أيام فيها مهام']];
  } else {
    let best = null;
    list.forEach(h => { const s = streakOf(h); if (!best || s > best.s) best = { s, h }; });
    sums = [[pc, 'نسبة الإنجاز في هذا الشهر (عادات ومهام)'], [`${perfect} من ${schedDays}`, 'أيام مكتملة'],
      tn ? [`${td} من ${tn}`, 'مهام منجزة هذا الشهر'] : [best && best.s ? daysAr(best.s) : '0', 'أطول سلسلة حالية', best && best.s ? `${esc(best.h.icon)} ${esc(best.h.name)}` : '']];
  }
  const from30 = addDays(t, -29);
  const rows = list.map(h => {
    const r = rangeRate([h], from30 > h.start ? from30 : h.start, t);
    const p30 = r == null ? 0 : Math.round(r * 100);
    return `<tr class="c-${h.color}"><td><span class="ht-name"><span aria-hidden="true">${esc(h.icon)}</span><span>${esc(h.name)}</span></span></td><td>${streakOf(h)}</td><td>${bestStreakOf(h)}</td><td>${p30}٪<span class="bar" aria-hidden="true"><i style="width:${p30}%"></i></span></td></tr>`;
  }).join('');
  const thread = selH ? selH.color : (isTasks ? 'kohl' : 'madder');
  return `<section class="pane">
    <h1 class="h2">الإحصائيات</h1>
    <div class="chips" role="group" aria-label="عرض حسب العادة أو المهام" style="margin-top:12px"><button type="button" data-act="stat" data-v="all" data-fk="stat-all" aria-pressed="${!selH && !isTasks}">الكل</button>${anyT ? `<button type="button" data-act="stat" data-v="tasks" data-fk="stat-tasks" aria-pressed="${isTasks}"><span aria-hidden="true">📝</span>المهام</button>` : ''}${list.map(h => `<button type="button" data-act="stat" data-v="${h.id}" data-fk="stat-${h.id}" aria-pressed="${!!selH && selH.id === h.id}"><span aria-hidden="true">${esc(h.icon)}</span>${esc(h.name)}</button>`).join('')}</div>
    ${perfSection(L, thread, T)}
    <div class="mnav"><button type="button" class="ibtn" data-act="m-prev" data-fk="m-prev" aria-label="الشهر السابق"${mk <= earliest ? ' disabled' : ''}>${SV.prev}</button><h2 class="h2">${esc(fmtMonth(mk))}</h2><button type="button" class="ibtn" data-act="m-next" data-fk="m-next" aria-label="الشهر التالي"${mk >= cur ? ' disabled' : ''}>${SV.next}</button></div>
    <div class="rug c-${thread}">${cells}</div>
    <div class="legend c-${thread}" aria-hidden="true"><span><svg viewBox="0 0 40 40">${dia(20, 20, 6, 'st-miss')}</svg>لم يُنجز</span><span><svg viewBox="0 0 40 40">${dia(20, 20, 10, 'th-fill')}</svg>إنجاز جزئي</span><span><svg viewBox="0 0 40 40">${dia(20, 20, 17, 'th-fill')}${dia(20, 20, 6, 'rc-eye')}</svg>يوم مكتمل</span></div>
    <div class="sums c-${thread}">${sums.map(([b, s, sub]) => `<div class="sum"><b>${b}</b><span>${s}</span>${sub ? `<span class="sum-sub">${sub}</span>` : ''}</div>`).join('')}</div>
    ${weekdaySection(L, thread, T)}
    ${list.length ? `<h2 class="h3">تفاصيل العادات</h2>
    <table class="htable"><caption class="sr-only">السلسلة الحالية وأفضل سلسلة ونسبة الإنجاز في آخر 30 يوماً لكل عادة</caption>
      <colgroup><col><col class="c-num"><col class="c-num"><col class="c-pc"></colgroup>
      <thead><tr><th scope="col">العادة</th><th scope="col">السلسلة</th><th scope="col">الأفضل</th><th scope="col">آخر 30 يوماً</th></tr></thead>
      <tbody>${rows}</tbody></table>` : ''}
  </section>`;
}

/* ================= ownership mark ================= */
const ownerFooter = () => `<footer class="owner">© ${OWNER_YEAR} <bdi><b>${esc(OWNER_NAME)}</b></bdi>. جميع الحقوق محفوظة.<br>نسيج لتتبّع العادات</footer>`;
function applyWatermark() {
  const el = document.getElementById('wm');
  if (!el) return;
  const ar = /[؀-ۿ]/.test(OWNER_NAME);
  const raw = ar ? '© ' + OWNER_NAME + ' ' + OWNER_YEAR : '© ' + OWNER_YEAR + ' ' + OWNER_NAME;
  const tw = raw.length * 9;
  const W = Math.max(300, Math.round(tw * 0.93 * 2 + 80)), H = Math.max(170, Math.round((tw * 0.375 + 16) * 2 + 60));
  const t = esc(raw);
  const txt = (x, y) => `<text x="${x}" y="${y}" text-anchor="middle" direction="${ar ? 'rtl' : 'ltr'}" transform="rotate(-22 ${x} ${y})" font-family="Tahoma, 'Segoe UI', 'Geeza Pro', Arial, sans-serif" font-size="15" font-weight="700" fill="#6F625A">${t}</text>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">${txt(Math.round(W / 4), Math.round(H / 4) + 6)}${txt(Math.round(3 * W / 4), Math.round(3 * H / 4) + 6)}</svg>`;
  el.style.backgroundImage = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
  el.style.backgroundSize = `${W}px ${H}px`;
}

function tapHabit(id, dir) {
  const h = S.habits.find(x => x.id === id);

  const v = getVal(k, id);

  setVal(k, id, nv);

}
function moveHabit(id, d) {
  const act = active();
  const i = act.findIndex(h => h.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= act.length) return;
  const a = S.habits.indexOf(act[i]), b = S.habits.indexOf(act[j]);

async function purgeHabit(id, fromDialog) {

  S.habits = S.habits.filter(x => x.id !== id);
  const touched = [];
  for (const [mk, days] of Object.entries(S.logs)) {
    let ch = false;
    for (const [k, vals] of Object.entries(days)) {
      if (Object.prototype.hasOwnProperty.call(vals, id)) { delete vals[id]; ch = true; if (!Object.keys(vals).length) delete days[k]; }
    }

/* ----- images, backup, wipe ----- */
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('type'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const N = 192, c = document.createElement('canvas');
          c.width = c.height = N;
          const g = c.getContext('2d');
          const m = Math.min(img.naturalWidth, img.naturalHeight);
          if (!m) return rej(new Error('size'));
          g.fillStyle = '#ffffff';
          g.fillRect(0, 0, N, N);
          g.drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, N, N);
          res(c.toDataURL('image/jpeg', 0.86));
        } catch (e) { rej(e); }
      };
      img.onerror = () => rej(new Error('decode'));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function onImage(file) {
  try {
    const url = await readImage(file);
    if (S.ui.fileFor === 'ob' && S.ui.ob) S.ui.ob.avatar = { kind:'image', value:url };
    else if (S.ui.fileFor === 'pf' && S.ui.pdraft) S.ui.pdraft.avatar = { kind:'image', value:url };
    render();
  } catch (e) {
    toast('تعذّرت قراءة الصورة. الأنسب صورة بصيغة JPG أو PNG.');
  }
}

    profiles: profilesList().map(([pid, d]) => ({ id:pid, profile:d.profile, habits:d.habits, logs:d.logs })) }, null, 2);
  try {
    const url = URL.createObjectURL(new Blob([payload], { type:'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'naseej-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('تم تنزيل النسخة الاحتياطية');
  } catch (e) {
    toast('تعذّر تنزيل النسخة الاحتياطية في هذا المتصفح');

async function importBackup(file) {
  let o;

  if (!o || o.app !== 'naseej') return bad();
  if (Array.isArray(o.profiles)) {
    const incoming = [];
    o.profiles.forEach(x => { const sl = normSlot(x); if (sl.profile && sl.profile.name) incoming.push([x && PID_RE.test(x.id) ? x.id : null, sl]); });
    if (!incoming.length) return bad();
    const ok = await confirmBox(`ستحل بيانات الملف (${profilesCountText(Math.min(incoming.length, MAX_PROFILES))}) محل كل البروفايلات الحالية وعاداتها وسجلها.`, 'استعادة النسخة');

    const oldIds = [...docIdsAll(), ...C.known];

  } catch (e) { S.sync.mode = 'auth'; S.ui.auth.fatal = true; render(); return; }
  FB.auth.getRedirectResult().catch(e => { authFail(authMsg(e)); if (S.sync.mode === 'auth') render(); });
  FB.auth.onAuthStateChanged(u => { onUser(u); });
}

/* ================= boot ================= */
applyTheme(getTheme());
applyWatermark();
try { console.info('%cنسيج', 'font-weight:700;font-size:14px;color:#A8292B', `\n© ${OWNER_YEAR} ${OWNER_NAME}. جميع الحقوق محفوظة.\nمعرّف الملكية: ${OWNERSHIP_ID}`); } catch (e) {}
buildDefs();
render();
connect();
})();
</script>
